[workspace]
members = ["crates/api", "crates/core", "crates/db", "crates/monitor", "crates/webhook"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CryptoPay Team"]
license = "MIT"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "uuid", "chrono", "rust_decimal", "macros", "migrate"] }
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
constant_time_eq = "0.3"
bs58 = "0.4"
async-trait = "0.1"
secp256k1 = "0.29"
